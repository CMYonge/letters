'<p>My dear [[person:1046]Mr Moor]
Your letter followed me home from [[other:140]Brighstone] whence I returned on Wednesday. I will give you 10/ for St Pauls church when next I have an opportunity, but on Monday I am going to Oxford and I do not come back till the 12th
</p><p>Yours sincerely
C M  Yonge
