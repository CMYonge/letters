'<p>My dear [[person:489]Miss Erskine]
I have asked Ivanovna to write to you herself as what I know comes chiefly from her. She is [[person:126]Miss Johanna Batty], I believe her father was a general, and she is very learned in all charities.[[footnote:1]]
</p><p>In haste yours sincerely
C M Yonge
</p>
