'<p>My dear [[person:1865]Bath Brick][[footnote:1]]
</p><p>Skelton was poet laureat to Henry VIII & Rector of Diss in Norfolk.  I am afraid he was not a very respectable person & I do not know his poems.  Your ‘Tact’ is the chosen one this time[[footnote:2]]
</p><p>Yours very sincerely
</p><p>Arachne
</p>
