'<p>My dear [[person:1345]Miss Dampier],
</p><p>Here are your books with many thanks, and the Scotch one. It is the Edinburgh baillie who is worth reading—the other is <u>horrid</u>. I will get the rest of Mademoiselle as soon as I can and send her or bring her.[[footnote:1]]
</p><p>Yours sincerely
C M  Yonge
</p>
